<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>pyRing Workshop · Participants</title>
<style>
  :root {
    --bg: #08090b; --panel: #101217; --border: #22252d;
    --text: #edeef0; --dim: #9298a3;
    --pink: #ff4d9d; --violet: #8b5cf6;
    --blue: #7cc4f2; --amber: #f5c26b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--pink); text-decoration: none; }
  a:hover { text-decoration: underline; }

  body > header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(8, 9, 11, 0.82); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  nav { max-width: 900px; margin: 0 auto; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .brand { font-weight: 600; letter-spacing: .01em; color: var(--text); }
  .brand span { color: var(--pink); }
  .brand:hover { text-decoration: none; }
  .navlink { color: var(--dim); font-size: .92rem; background: none; border: 0; font: inherit; font-size: .92rem; cursor: pointer; padding: 0; }
  .navlink:hover { color: var(--text); text-decoration: none; }

  main { max-width: 900px; margin: 0 auto; padding: 0 24px 72px; }

  /* ---------- lock screen ---------- */
  .lock { min-height: calc(100vh - 160px); display: grid; place-items: center; position: relative; }
  .lock::before {
    content: ""; position: absolute; top: 50%; left: 50%; width: min(560px, 100%); height: 300px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(255,77,157,.16) 0%, rgba(139,92,246,.09) 40%, transparent 70%);
    filter: blur(20px); pointer-events: none;
  }
  .lock-card {
    position: relative; width: min(400px, 100%); text-align: center;
    border: 1px solid var(--border); background: var(--panel); border-radius: 16px; padding: 34px 28px 28px;
  }
  .lock-icon {
    width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid rgba(255,77,157,.45); color: var(--pink);
  }
  .lock-card h1 { font-size: 1.3rem; margin: 0 0 6px; letter-spacing: -.01em; }
  .lock-card p { color: var(--dim); font-size: .9rem; margin: 0 0 22px; }
  .lock-card form { display: flex; flex-direction: column; gap: 12px; }
  .lock-card input {
    font: inherit; font-size: 1rem; color: var(--text); text-align: center; letter-spacing: .04em;
    background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 11px 18px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .lock-card input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,77,157,.15); }
  .lock-card button {
    font: inherit; font-weight: 600; font-size: .98rem; color: #0b0b0d; cursor: pointer;
    border: 0; border-radius: 999px; padding: 11px 18px;
    background: linear-gradient(90deg, var(--pink), var(--violet));
    box-shadow: 0 6px 26px rgba(255,77,157,.25); transition: transform .2s, opacity .2s;
  }
  .lock-card button:hover { transform: translateY(-1px); }
  .lock-card button[disabled] { opacity: .6; cursor: progress; transform: none; }
  .err { min-height: 1.3em; margin: 4px 0 0; color: var(--pink); font-size: .85rem; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }

  /* ---------- notes ---------- */
  .intro { padding: 56px 0 30px; }
  .eyebrow { color: var(--pink); font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 8px; }
  .intro h1 { font-size: clamp(1.9rem, 5vw, 2.5rem); line-height: 1.15; margin: 0 0 10px; letter-spacing: -.02em; }
  .intro h1 em {
    font-style: normal; background: linear-gradient(90deg, var(--pink), var(--violet));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--pink);
  }
  .lede { color: var(--dim); margin: 0 0 22px; max-width: 620px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .key { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: .85rem; }
  .key::before { content: ""; width: 10px; height: 10px; border-radius: 50%; }
  .k-have::before { background: var(--text); }
  .k-new::before  { background: linear-gradient(135deg, var(--pink), var(--violet)); }
  .k-who::before  { background: var(--blue); }
  .k-pri::before  { background: var(--amber); }

  .families { display: grid; gap: 14px; }
  .fam {
    border: 1px solid var(--border); background: var(--panel); border-radius: 12px; padding: 18px 20px 20px;
    transition: border-color .25s, box-shadow .25s;
  }
  .fam:hover { border-color: rgba(255,77,157,.4); box-shadow: 0 8px 30px rgba(255,77,157,.07); }
  .fam-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .fam h2 { font-size: 1.15rem; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .fam h2::before { content: ""; width: 3px; height: 18px; border-radius: 2px; background: linear-gradient(180deg, var(--pink), var(--violet)); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .col h3 { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
  .col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .col li { position: relative; padding-left: 18px; font-size: .93rem; }
  .col li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; border-radius: 50%; }
  .have li { color: var(--text); }
  .have li::before { background: transparent; border: 1.5px solid var(--text); }
  .new li { color: #ffd1e6; }
  .new li::before { background: linear-gradient(135deg, var(--pink), var(--violet)); }
  .new h3 { color: var(--pink); }
  .dropped { color: var(--dim) !important; text-decoration: line-through; text-decoration-color: rgba(146,152,163,.6); }
  .dropped::before { border-color: var(--dim) !important; }

  .who, .pri, .tag {
    display: inline-block; font-size: .74rem; font-weight: 500; line-height: 1.5;
    border-radius: 999px; padding: 0 9px; margin-left: 6px; vertical-align: 1px; white-space: nowrap;
  }
  .who { color: var(--blue); border: 1px solid rgba(124,196,242,.4); background: rgba(124,196,242,.08); }
  .pri { color: var(--amber); border: 1px solid rgba(245,194,107,.45); background: rgba(245,194,107,.08); }
  .fam-head .pri { margin-left: 0; }
  .tag { color: var(--dim); border: 1px solid var(--border); text-decoration: none; display: inline-block; }

  @media (max-width: 620px) {
    .cols { grid-template-columns: 1fr; gap: 16px; }
    .intro { padding-top: 40px; }
  }

  footer { max-width: 900px; margin: 0 auto; padding: 30px 24px 64px; color: var(--dim); font-size: .84rem; border-top: 1px solid var(--border); text-align: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .revealed { animation: rise .5s ease-out both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <nav>
    <a class="brand" href="./">py<span>Ring</span> Workshop</a>
    <span>
      <a class="navlink" href="./">Main page</a>
      <button class="navlink" id="logout" type="button" hidden>&nbsp;&middot;&nbsp; Lock</button>
    </span>
  </nav>
</header>

<main id="main">
  <section class="lock" id="lock">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h1>Participants only</h1>
      <p>Enter the passcode you received from the organisers.</p>
      <form id="form" autocomplete="off">
        <input id="pass" type="password" placeholder="Passcode" aria-label="Passcode" autofocus required>
        <button id="go" type="submit">Unlock</button>
        <p class="err" id="err" role="alert"></p>
      </form>
    </div>
  </section>
</main>

<footer>pyRing Workshop &middot; Lisbon 2026 &middot; participants&rsquo; notes</footer>
